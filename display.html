<!doctype html>
<html>
	<head>
		<title>LW Display</title>
		<style>

@font-face {
  font-family: cloud-font;
  src: url("assets/cloud-font.woff2");
}

@font-face {
  font-family: hunny-bummy;
  src: url("assets/HunnyBummy.woff");
}

html {
height: 100%;
}

body {
	height: 100%;
	padding: 0;
	margin: 0;

	background: url("assets/xp.png");
	background-color: rgb(30,30,30);
	background-position: center;
	background-repeat: no-repeat;
	background-size: contain;
	color: #FFFFFF;
}

h2 {
	font-family: cloud-font, sans-serif;
	font-size: 70px;
}

h3 {
	font-family: hunny-bummy, sans-serif;
	font-size: 60px;
	margin-bottom: 20px;
	margin-top: 20px;
}

#main-container {
	position: absolute;
	height: 900px;
	width: 1200px;
	top: 50%;
	left: 50%;
	margin-top: -490px;
	margin-left: -640px;
	text-align: center;
	border-radius: 40px;
	background-color: #00000077;
	padding: 40px;
}

#changing-text {

	-webkit-transition: opacity .5s ease-in-out;
	-moz-transition: opacity .5s ease-in-out;
	-ms-transition: opacity .5s ease-in-out;
	-o-transition: opacity .5s ease-in-out;
	transition: opacity .5s ease-in-out;
}

.gol {
	font-family: "Noto Sans Mono", monospace;
}

img {
	width: 100%;
}


		</style>
	</head>



	<body>
		<center>
			<div id="main-container">
				<div id="changing-text">
					<h2>Hello world</h2>
				</div>
			</div>
		</center>


		<script>

			//var board = new DepartureBoard (document.getElementById ('test'), { rowCount: 11, letterCount: 25 });

			var last_response_text = ""

			get_data = function() {
				var xhttp = new XMLHttpRequest();
				xhttp.open("GET", "/update/");
				xhttp.onload = function() {
					response = JSON.parse(this.responseText);
					if (response.new_text != last_response_text) {
						last_response_text = response.new_text
						console.log(response.new_text);
						c = document.getElementById('changing-text');
						c.style.opacity = 0;
						setTimeout(function(){
							c.innerHTML = response.new_text;
							c.style.opacity = 1;
						}, 500);


					}
				}
				xhttp.send();

				window.setTimeout(get_data, 1000);
			}

			get_data();

		</script>
	</body>
</html>
